
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lula x Bolsonaro — Live</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:15px;background:#141827;font-size:23px;font-weight:bold}
.status{font-size:12px;color:#bbb;margin:12px}
.score{display:flex;gap:10px;padding:10px}
.team{flex:1;padding:12px 5px;border-radius:14px;min-width:0}
.blue{background:#123f9b;border:2px solid #4385ff}
.red{background:#9d171e;border:2px solid #ff5151}
.photo{width:100%;height:190px;object-fit:cover;object-position:top;border-radius:10px}
.team h2{font-size:18px;margin:10px 0}
.points{font-size:44px;font-weight:bold}
.bar{height:18px;background:#292d3a;margin:12px;border-radius:20px;overflow:hidden;display:flex}
#bluebar{height:100%;width:50%;background:#3982ff}
#redbar{height:100%;width:50%;background:#ff4040}
.timer{font-size:42px;font-weight:bold;margin:16px}
button{border:0;border-radius:10px;padding:12px;margin:4px;color:white;font-weight:bold;font-size:13px}
.btnblue{background:#2368e8}.btnred{background:#db2934}
.neutral{background:#303647}
.note{font-size:11px;color:#aaa;padding:12px}
</style>
</head>
<body>

<header>🇧🇷 LULA × BOLSONARO 🇧🇷</header>
<div class="status" id="status">Conectando ao servidor...</div>

<div class="score">
  <div class="team blue">
    <img class="photo"
      src="https://commons.wikimedia.org/wiki/Special:FilePath/Foto_oficial_de_Luiz_In%C3%A1cio_Lula_da_Silva_(2023%E2%80%932027).jpg?width=400"
      alt="Lula">
    <h2>🔵 LULA</h2>
    <div class="points" id="blue">0</div>
    <div>PONTOS</div>
  </div>

  <div class="team red">
    <img class="photo"
      src="https://commons.wikimedia.org/wiki/Special:FilePath/2019-01-10_Retrato_Oficial_do_Presidente_da_Rep%C3%BAblica_-_Jair_Messias_Bolsonaro.jpg?width=400"
      alt="Jair Bolsonaro">
    <h2>🔴 BOLSONARO</h2>
    <div class="points" id="red">0</div>
    <div>PONTOS</div>
  </div>
</div>

<div class="bar">
  <div id="bluebar"></div>
  <div id="redbar"></div>
</div>

<div class="timer" id="timer">05:00</div>

<div>
  <button class="btnblue" onclick="demo('blue')">🎁 Testar Lula +1</button>
  <button class="btnred" onclick="demo('red')">🎁 Testar Bolsonaro +1</button>
</div>

<div>
  <button class="neutral" onclick="resetGame()">↻ Zerar pontos</button>
  <button class="neutral" onclick="fullScreen()">⛶ Tela cheia</button>
</div>

<div class="note">
O tempo reinicia automaticamente a cada 5 minutos.
Os presentes reais dependem da conexão com o TikTok LIVE.
</div>

<script>
let scores={blue:0,red:0};
let seconds=300;
let interval=null;

function render(){
 document.getElementById('blue').textContent=scores.blue;
 document.getElementById('red').textContent=scores.red;

 let total=scores.blue+scores.red||1;

 document.getElementById('bluebar').style.width=
 (scores.blue/total*100)+'%';

 document.getElementById('redbar').style.width=
 (scores.red/total*100)+'%';

 document.getElementById('timer').textContent=
 String(Math.floor(seconds/60)).padStart(2,'0')+':'+
 String(seconds%60).padStart(2,'0');
}

function demo(team){
 scores[team]++;
 render();
}

function startTimer(){
 if(interval!==null)return;

 interval=setInterval(()=>{
   if(seconds>0){
     seconds--;
   }else{
     seconds=300;
   }
   render();
 },1000);
}

function resetGame(){
 scores={blue:0,red:0};
 render();
}

function fullScreen(){
 if(!document.fullscreenElement){
   document.documentElement.requestFullscreen?.();
 }else{
   document.exitFullscreen?.();
 }
}

const protocol=location.protocol==='https:'?'wss:':'ws:';
const socket=new WebSocket(protocol+'//'+location.host);

socket.onopen=()=>{
 document.getElementById('status').textContent=
 'Conectado ao servidor; aguardando TikTok…';
};

socket.onclose=()=>{
 document.getElementById('status').textContent=
 'Servidor desconectado';
};

socket.onerror=()=>{
 document.getElementById('status').textContent=
 'Não foi possível conectar ao servidor';
};

socket.onmessage=e=>{
 try{
  const data=JSON.parse(e.data);

  if(data.type==='init'&&data.totals){
   scores=data.totals;
   render();
   if(data.status?.message)
    document.getElementById('status').textContent=
    data.status.message;
  }

  if(data.type==='gift'&&data.totals){
   scores=data.totals;
   render();
  }

  if(data.type==='status'&&data.status){
   document.getElementById('status').textContent=
   data.status.message;
  }
 }catch(err){}
};

render();
startTimer();
</script>
</body>
</html>
