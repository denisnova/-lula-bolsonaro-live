<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Corrida Presidencial - TikTok Live</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a14;font-family:'Arial Black',Gadget,sans-serif}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.querySelector("#game");
const c = canvas.getContext("2d");

const W = 720, H = 1280;
const ROUND_DURATION = 90000;

let startTime = performance.now();
let isFinished = false;
let winnerText = "";
let speedLula = 40, speedBolso = 40;
let progressLula = 10, progressBolso = 10;
let boostEffects = [];
let chatFeedLog = [];
let autoRestartTimeout = null;

function handleResize() {
    const scaleFactor = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = window.innerWidth * scaleFactor;
    canvas.height = window.innerHeight * scaleFactor;
    c.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener("resize", handleResize);
handleResize();

function drawRect(x, y, w, h, fillColor, strokeColor = null, strokeWidth = 2, radius = 0) {
    c.beginPath();
    if (radius) {
        c.roundRect(x, y, w, h, radius);
    } else {
        c.rect(x, y, w, h);
    }
    c.fillStyle = fillColor;
    c.fill();
    if (strokeColor) {
        c.strokeStyle = strokeColor;
        c.lineWidth = strokeWidth;
        c.stroke();
    }
}

function drawText(textStr, x, y, size, color = "#fff", align = "center", strokeColor = "#000", strokeWidth = 4) {
    c.font = `900 ${size}px 'Arial Black', Impact, sans-serif`;
    c.textAlign = align;
    if (strokeColor) {
        c.strokeStyle = strokeColor;
        c.lineWidth = strokeWidth;
        c.strokeText(textStr, x, y);
    }
    c.fillStyle = color;
    c.fillText(textStr, x, y);
}

function drawSmoothLine(x1, y1, x2, y2, color, width) {
    c.strokeStyle = color;
    c.lineWidth = width;
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(x1, y1);
    c.lineTo(x2, y2);
    c.stroke();
}

// Estádio e fundo detalhado
function renderStadium(timestamp) {
    let skyGradient = c.createLinearGradient(0, 0, 0, 320);
    skyGradient.addColorStop(0, "#101d35");
    skyGradient.addColorStop(0.5, "#233d64");
    skyGradient.addColorStop(1, "#52759e");
    drawRect(0, 0, W, 320, skyGradient);

    drawRect(0, 150, W, 170, "#182333");
    const seatColors = ["#e53935", "#43a047", "#1e88e5", "#fdd835", "#ffffff", "#fb8c00"];
    for (let row = 0; row < 6; row++) {
        for (let col = 0; col < 40; col++) {
            let seatX = col * 19 + ((row % 2) * 9) - ((timestamp * 0.015) % 19);
            let seatY = 160 + row * 26;
            let colorIndex = (col * 5 + row * 9) % seatColors.length;
            drawRect(seatX, seatY, 10, 12, seatColors[colorIndex], null, 0, 2);
            drawRect(seatX + 2, seatY - 5, 6, 5, "#f5c29b", null, 0, 3);
        }
    }

    drawRect(0, 310, W, 15, "#0b1018");
    drawRect(0, 325, W, 10, "#ffffff");
}

// Pista com perspectiva inclinada dinâmica
function renderPerspectiveTrack(timestamp) {
    drawRect(0, 335, W, 750, "#b84c38");

    for (let i = 0; i < 5; i++) {
        let lineY = 360 + i * 135;
        drawRect(0, lineY, W, 6, "rgba(255, 255, 255, 0.85)");
    }

    let trackShift = (timestamp * 0.4) % 160;
    for (let i = -2; i < 8; i++) {
        let posX = i * 160 - trackShift;
        drawSmoothLine(posX, 335, posX + 100, 1085, "rgba(255, 255, 255, 0.18)", 8);
    }
}

// Personagens orgânicos e fluidos
function renderOrganicRunner(x, y, teamType, timestamp, isLeader) {
    c.save();
    c.translate(x, y);
    c.scale(1.25, 1.25);

    const isLula = teamType === "lula";
    const primaryColor = isLula ? "#d62828" : "#1b8a4f";
    const darkColor = isLula ? "#9e1b1b" : "#125933";
    
    const runCycle = Math.sin(timestamp * 0.025);
    const armCycle = Math.cos(timestamp * 0.025);

    c.fillStyle = "rgba(0, 0, 0, 0.45)";
    c.beginPath();
    c.ellipse(0, 22, 32, 11, 0, 0, Math.PI * 2);
    c.fill();

    drawSmoothLine(-6, 2, -22 + runCycle * 25, 22, darkColor, 13);
    drawSmoothLine(6, 2, 22 - runCycle * 25, 22, darkColor, 13);

    drawRect(-30 + runCycle * 25, 20, 16, 9, "#ffffff", "#ccc", 1, 4);
    drawRect(14 - runCycle * 25, 20, 16, 9, "#ffffff", "#ccc", 1, 4);

    let bodyGrad = c.createLinearGradient(-18, -50, 18, 0);
    bodyGrad.addColorStop(0, primaryColor);
    bodyGrad.addColorStop(1, darkColor);

    c.beginPath();
    c.roundRect(-18, -50, 36, 46, [10, 10, 6, 6]);
    c.fillStyle = bodyGrad;
    c.fill();
    c.strokeStyle = "#111";
    c.lineWidth = 2;
    c.stroke();

    if (!isLula) {
        drawRect(-18, -50, 36, 9, "#f3c623", null, 0, [8, 8, 0, 0]);
    } else {
        drawText("★", 0, -27, 15, "#ffffff", "center", null);
    }

    drawSmoothLine(-16, -40, -28 - armCycle * 16, -18, primaryColor, 11);
    drawSmoothLine(16, -40, 28 + armCycle * 16, -18, primaryColor, 11);

    c.beginPath();
    c.arc(-28 - armCycle * 16, -18, 5, 0, Math.PI * 2);
    c.arc(28 + armCycle * 16, -18, 5, 0, Math.PI * 2);
    c.fillStyle = "#f3be98";
    c.fill();

    let headGrad = c.createRadialGradient(0, -78, 2, 0, -78, 28);
    headGrad.addColorStop(0, "#ffdbb5");
    headGrad.addColorStop(1, "#dfa47c");

    c.beginPath();
    c.arc(0, -78, 26, 0, Math.PI * 2);
    c.fillStyle = headGrad;
    c.fill();
    c.strokeStyle = "#222";
    c.lineWidth = 2;
    c.stroke();

    if (isLula) {
        c.fillStyle = "#dcdcdc";
        c.beginPath(); c.arc(0, -90, 27, Math.PI, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(0, -72, 26, 0.2, Math.PI - 0.2); c.fill();
        drawRect(-26, -96, 52, 8, "#d62828", null, 0, 3);
    } else {
        c.fillStyle = "#3d2b1f";
        c.beginPath(); c.arc(0, -92, 26, Math.PI * 0.8, Math.PI * 2.2); c.fill();
        drawRect(-16, -82, 13, 9, "rgba(0,0,0,0.2)", "#333", 1.5, 2);
        drawRect(3, -82, 13, 9, "rgba(0,0,0,0.2)", "#333", 1.5, 2);
        drawSmoothLine(-3, -77, 3, -77, "#333", 2);
    }

    c.fillStyle = "#111";
    c.beginPath();
    c.arc(-7, -78, 3, 0, Math.PI * 2);
    c.arc(9, -78, 3, 0, Math.PI * 2);
    c.fill();

    c.restore();

    let tagBackground = isLeader ? "#f3c623" : "#d62828";
    let tagMessage = isLeader ? (isLula ? "1º  13 LULA" : "1º  22 BOLSO") : (isLula ? "2º  13 LULA" : "2º  22 BOLSO");
    drawRect(x - 70, y - 180, 140, 28, tagBackground, "#ffffff", 2, 6);
    drawText(tagMessage, x, y - 160, 14, "#000000", "center", "#ffffff", 1);
}

// Menu lateral com ícones
function renderGiftsSidebar() {
    renderSingleGiftBadge(35, 360, "🌹", "13 VELOZ", "#e62238");
    renderSingleGiftBadge(35, 460, "❤️", "22 ESCORREGA", "#e62238");
    renderSingleGiftBadge(35, 560, "🍩", "13 SUPER VELOZ", "#e62238");

    renderSingleGiftBadge(W - 35, 360, "🎵", "22 VELOZ", "#11a855");
    renderSingleGiftBadge(W - 35, 460, "🦖", "13 ESCORREGA", "#11a855");
    renderSingleGiftBadge(W - 35, 560, "🎉", "22 SUPER VELOZ", "#11a855");
}

function renderSingleGiftBadge(x, y, emojiSymbol, labelText, themeColor) {
    c.save();
    c.fillStyle = "rgba(0, 0, 0, 0.75)";
    c.beginPath();
    c.arc(x, y, 24, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = themeColor;
    c.lineWidth = 3;
    c.stroke();
    drawText(emojiSymbol, x, y + 8, 22, "#fff", "center", null);

    if (x < W / 2) {
        drawText(labelText, x + 35, y + 5, 11, themeColor, "left", "#000", 3);
    } else {
        drawText(labelText, x - 35, y + 5, 11, themeColor, "right", "#000", 3);
    }
    c.restore();
}

// Placar superior
function renderTopArcadeHUD(elapsedTimeMs) {
    drawRect(0, 0, W, 195, "#090e17");
    drawText("CORRIDA PRESIDENCIAL", W / 2, 38, 24, "#ffffff", "center", "#000", 5);

    drawRect(W - 140, 12, 125, 42, "#f3c623", "#000", 3, 6);
    let secondsLeft = Math.max(0, Math.ceil((ROUND_DURATION - elapsedTimeMs) / 1000));
    drawText(`00:${String(secondsLeft).padStart(2, '0')}s`, W - 77, 41, 26, "#000000", "center", null);

    const isLulaAhead = progressLula >= progressBolso;

    renderCompetitorCard(15, 55, isLulaAhead ? "1º" : "2º", "13 LULA", progressLula, Math.floor(speedLula), "#d62828", isLulaAhead);
    renderCompetitorCard(15, 97, isLulaAhead ? "2º" : "1º", "22 BOLSO", progressBolso, Math.floor(speedBolso), "#11a855", !isLulaAhead);

    drawRect(15, 142, W - 30, 44, "rgba(16, 26, 45, 0.95)", "#223555", 2, 8);
    if (chatFeedLog.length > 0) {
        let currentChat = chatFeedLog[chatFeedLog.length - 1];
        drawText(`${currentChat.user} enviou ${currentChat.gift} x${currentChat.count}`, 25, 169, 13, "#ffffff", "left", "#000", 2);
        drawText(`IMPULSO - ${currentChat.target.toUpperCase()}`, 380, 169, 12, "#f3c623", "left", "#000", 2);
    }
}

function renderCompetitorCard(x, y, positionText, nameText, percentageVal, speedVal, cardColor, isLeaderCard) {
    drawRect(x, y, W - 30, 38, "#162032", "#000", 2, 6);
    drawRect(x + 4, y + 4, 30, 30, isLeaderCard ? "#f3c623" : "#3a4d6e", null, 0, 4);
    drawText(positionText, x + 19, y + 25, 14, isLeaderCard ? "#000" : "#fff", "center", null);
    drawText(nameText, x + 100, y + 26, 15, cardColor, "left", "#000", 3);
    drawRect(x + 180, y + 11, 320, 16, "#0a0f18", null, 0, 4);
    drawRect(x + 180, y + 11, 320 * (percentageVal / 100), 16, cardColor, null, 0, 4);
    drawText(`${Math.floor(percentageVal)}%`, x + 535, y + 26, 15, "#ffffff", "right", "#000", 2);
    drawText(`${speedVal} KM/H`, x + 635, y + 26, 13, "#f3c623", "right", "#000", 2);
}

function renderDistanceMeterWidget() {
    let metersGap = Math.abs(progressLula - progressBolso) * 4.2;
    drawRect(45, 1150, W - 90, 32, "rgba(0, 0, 0, 0.75)", "#334466", 2, 8);
    drawSmoothLine(70, 1166, W - 70, 1166, "#f3c623", 3);
    drawSmoothLine(70, 1158, 70, 1174, "#f3c623", 3);
    drawSmoothLine(W - 70, 1158, W - 70, 1174, "#f3c623", 3);
    drawText(`+${metersGap.toFixed(1)} m`, W / 2, 1172, 17, "#4ae38d", "center", "#000", 3);
}

function renderFloatingBoostEffects(currentTime) {
    for (let i = boostEffects.length - 1; i >= 0; i--) {
        let fx = boostEffects[i];
        let lifespan = currentTime - fx.startTime;
        if (lifespan > 1800) {
            boostEffects.splice(i, 1);
            continue;
        }
        let alphaValue = 1 - (lifespan / 1800);
        let currentY = fx.posY - (lifespan * 0.06);

        c.save();
        c.globalAlpha = alphaValue;
        drawText(fx.message, fx.posX, currentY, 28, fx.color, "center", "#000000", 5);
        c.restore();
    }
}

// Funções para receber os impulsos reais da live (WebSocket / PostMessage)
function applyGiftBoost(team, giftName, boostValue = 5) {
    if (isFinished) return;
    if (team === 'lula') {
        progressLula = Math.min(100, progressLula + boostValue);
        speedLula += 6;
        boostEffects.push({ posX: 220, posY: 580, message: `+${boostValue}% IMPULSO`, color: "#4ae38d", startTime: performance.now() });
        chatFeedLog.push({ user: "Espectador", gift: giftName, count: 1, target: "13 Lula" });
    } else {
        progressBolso = Math.min(100, progressBolso + boostValue);
        speedBolso += 6;
        boostEffects.push({ posX: 500, posY: 720, message: `+${boostValue}% IMPULSO`, color: "#4ae38d", startTime: performance.now() });
        chatFeedLog.push({ user: "Espectador", gift: giftName, count: 1, target: "22 Bolsonaro" });
    }
}

// Ouve eventos externos caso sua live envie mensagens (ex: TikTok Live connector)
window.addEventListener("message", (event) => {
    const data = event.data;
    if (data && data.type === "gift") {
        if (data.target === "lula") applyGiftBoost("lula", data.gift || "Rosa 🌹", 5);
        if (data.target === "bolsonaro") applyGiftBoost("bolsonaro", data.gift || "TikTok 🎵", 5);
    }
});

function resetRoundAutomatically() {
    startTime = performance.now();
    isFinished = false;
    winnerText = "";
    progressLula = 10;
    progressBolso = 10;
    speedLula = 40;
    speedBolso = 40;
    boostEffects = [];
    chatFeedLog = [];
    if (autoRestartTimeout) {
        clearTimeout(autoRestartTimeout);
        autoRestartTimeout = null;
    }
}

function gameLoop(timestamp) {
    let elapsedTime = timestamp - startTime;

    if (!isFinished) {
        // Movimento inercial suave (só avança se houver velocidade dos presentes)
        progressLula = Math.min(100, progressLula + (speedLula * 0.0001));
        progressBolso = Math.min(100, progressBolso + (speedBolso * 0.0001));

        if (speedLula > 10) speedLula -= 0.02;
        if (speedBolso > 10) speedBolso -= 0.02;

        if (progressLula >= 100 || progressBolso >= 100 || elapsedTime >= ROUND_DURATION) {
            isFinished = true;
            winnerText = progressLula > progressBolso ? "13 LULA VENCEU!" : (progressBolso > progressLula ? "22 BOLSONARO VENCEU!" : "EMPATE!");
            
            if (!autoRestartTimeout) {
                autoRestartTimeout = setTimeout(() => {
                    resetRoundAutomatically();
                }, 6000);
            }
        }
    }

    renderStadium(timestamp);
    renderPerspectiveTrack(timestamp);

    let runnerXLula = 90 + (progressLula * 5.4);
    let runnerXBolso = 90 + (progressBolso * 5.4);
    let lulaLeads = progressLula >= progressBolso;

    renderOrganicRunner(Math.min(W - 95, runnerXLula), 620, "lula", timestamp, lulaLeads);
    renderOrganicRunner(Math.min(W - 95, runnerXBolso), 880, "bolsonaro", timestamp + 400, !lulaLeads);

    renderGiftsSidebar();
    renderFloatingBoostEffects(timestamp);
    renderDistanceMeterWidget();
    renderTopArcadeHUD(elapsedTime);

    if (isFinished) {
        drawRect(80, 500, W - 160, 200, "rgba(9, 14, 23, 0.96)", "#f3c623", 4, 12);
        drawText("FIM DA RODADA!", W / 2, 560, 32, "#ffffff", "center", "#000", 5);
        drawText(winnerText, W / 2, 630, 28, winnerText.includes("13") ? "#e62238" : "#11a855", "center", "#000", 4);
        drawText("Reiniciando nova rodada...", W / 2, 675, 15, "#ccc", "center", null);
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
