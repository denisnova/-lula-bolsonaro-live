<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duelo de Digitação - Live</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#05070c;color:white;font-family:Arial,sans-serif;text-align:center;overflow-x:hidden}
header{padding:8px;background:#0d111a;font-size:16px;font-weight:bold;border-bottom:1px solid #222}
.status{font-size:11px;color:#888;padding:4px}

/* Top Stats Bar */
.top-stats{display:flex;background:#111622;margin:6px 10px;border-radius:10px;padding:8px;justify-content:space-around;align-items:center;border:1px solid #222736}
.stat-box{text-align:center}
.stat-label{font-size:9px;color:#aaa;text-transform:uppercase;font-weight:bold}
.stat-val{font-size:16px;font-weight:bold;font-family:monospace}
.lead-badge{background:#c92030;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:bold;color:white}
.lead-badge.bolso-lead{background:#07854e}

/* Arena Layout */
.arena{display:flex;gap:6px;padding:6px 10px}
.player{flex:1;min-width:0;border-radius:12px;padding:8px 6px;position:relative}
.lula{background:#7a1118;border:2px solid #ff3b47}
.bolso{background:#064a2c;border:2px solid #1ec978}

.player-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.number-tag{font-size:18px;font-weight:bold;font-family:monospace}
.crown-tag{background:#f5c518;color:#000;font-size:9px;padding:2px 5px;border-radius:4px;font-weight:bold}

.main-score-box{background:#11151f;border-radius:10px;padding:8px 4px;margin-bottom:6px;border:2px solid rgba(255,255,255,0.1)}
.score-num{font-family:monospace;font-size:42px;font-weight:bold;line-height:1}
.lula .score-num{color:#ff4d55}
.bolso .score-num{color:#35ff9b}
.score-label{font-size:9px;color:#bbb;margin-top:2px;letter-spacing:1px}

.sub-info{display:flex;justify-content:space-between;font-size:11px;font-weight:bold;padding:0 4px;margin-bottom:6px}

/* Urna / Teclado */
.urna{background:#f0f0f0;border-radius:8px;padding:6px;color:#111;display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:6px;position:relative}
.urna-screen{background:#fff;border:2px solid #ccc;border-radius:4px;width:55px;height:55px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;color:#111;text-align:center;padding:2px}
.urna-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;flex:1}
.u-key{background:#222;color:#fff;border-radius:3px;font-size:10px;padding:4px 0;text-align:center;font-family:monospace}

/* Mãozinha animada sobre o teclado */
.hand-pointer {
  position: absolute;
  font-size: 24px;
  bottom: -10px;
  right: 30px;
  display: none;
  z-index: 5;
  pointer-events: none;
}
.typing .hand-pointer {
  display: block;
  animation: clickHand .4s infinite alternate ease-in-out;
}
@keyframes clickHand {
  0% { transform: translateY(0) scale(1); }
  100% { transform: translateY(-8px) scale(1.1); }
}

/* Timer central */
.timer-container{background:#111622;margin:0 10px 6px 10px;border-radius:10px;padding:6px;border:1px solid #222736}
.timer{font-size:36px;font-weight:bold;font-family:monospace;letter-spacing:2px}

/* Barras e Botões */
.bar{display:flex;height:8px;margin:0 10px 6px 10px;background:#222;border-radius:10px;overflow:hidden}
#barL{background:#f23843;width:50%;transition:width .3s}
#barB{background:#26d986;width:50%;transition:width .3s}

.controls{display:flex;justify-content:center;gap:4px;padding:0 10px}
button{border:0;border-radius:8px;padding:8px 10px;color:white;background:#252d3d;font-weight:bold;font-size:11px;cursor:pointer}
button:active{transform:scale(.96)}
.redbtn{background:#c92030}
.greenbtn{background:#07854e}

#speech{margin:6px 10px;padding:8px;background:#11151f;border-radius:8px;min-height:40px;border:1px solid #222}
#speaker{font-size:11px;font-weight:bold;color:#f5c518;margin-bottom:2px}
#phrase{font-size:12px}

#victory{display:none;position:fixed;inset:0;z-index:10;background:#050711ed;align-items:center;justify-content:center;flex-direction:column;padding:20px}
#victory.show{display:flex;animation:pop .4s}
#trophy{font-size:70px;animation:bounce .5s infinite alternate}
#winTitle{font-size:24px;font-weight:bold;margin:10px}
#winText{font-size:16px;margin-bottom:15px}
.confetti{position:fixed;top:-30px;z-index:12;pointer-events:none;font-size:25px;animation:fall 2.8s linear forwards}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes bounce{to{transform:translateY(-12px) rotate(6deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:0}}
</style>
</head>
