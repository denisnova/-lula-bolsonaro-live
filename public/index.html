
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corrida Presidencial</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101820;color:white;
  font-family:Arial,sans-serif;text-align:center;
  overflow:hidden
}
h1{font-size:clamp(23px,5vw,38px);margin:15px 0 5px}
.sub{color:#cbd5e1;margin:5px}
.pista{
  position:relative;margin:25px 12px;
  height:145px;border-radius:15px;
  background:repeating-linear-gradient(
    90deg,#333 0px,#333 35px,#444 35px,#444 70px
  );
  border:3px solid white;overflow:hidden
}
.pista.bolsonaro{border-color:#16c75b}
.pista.lula{border-color:#ed3030}
.linha{
  position:absolute;right:22px;top:0;bottom:0;
  border-left:5px dashed white
}
.corredor{
  position:absolute;left:8px;top:50%;
  transform:translateY(-50%);
  font-size:48px;transition:left .15s linear;
  white-space:nowrap
}
.bandeira{
  position:absolute;right:0;top:0;
  height:100%;width:35px;
  background:repeating-linear-gradient(
    0deg,white 0 10px,#111 10px 20px
  )
}
.nome{font-size:20px;font-weight:bold;margin-top:10px}
.lula-texto{color:#ff5b5b}
.bolsonaro-texto{color:#39e878}
#status{font-size:19px;margin:20px 8px;min-height:28px}
button{
  border:0;border-radius:10px;padding:13px 16px;
  margin:5px;font-weight:bold;font-size:15px;
  color:white;background:#2563eb
}
.vermelho{background:#dc2626}
.verde{background:#15803d}
.secundario{background:#475569}
#fim{font-size:28px;font-weight:bold;margin:15px}
</style>
</head>
<body>

<h1>🏁 CORRIDA PRESIDENCIAL 🏁</h1>
<p class="sub">Rosas impulsionam Lula • Presentes impulsionam Bolsonaro</p>

<div class="nome lula-texto">🔴 LULA</div>
<div class="pista lula">
  <div class="linha"></div>
  <div class="corredor" id="corredorLula">🏃‍♂️</div>
</div>

<div class="nome bolsonaro-texto">🟢 BOLSONARO</div>
<div class="pista bolsonaro">
  <div class="linha"></div>
  <div class="corredor" id="corredorBolsonaro">🏃‍♂️</div>
</div>

<div id="status">A corrida começou! Digite 13 para Lula ou 22 para Bolsonaro.</div>
<div id="fim"></div>

<div>
  <button class="vermelho" onclick="impulsoLula()">🌹 Testar rosa — Lula</button>
  <button class="verde" onclick="impulsoBolsonaro()">🎁 Testar presente — Bolsonaro</button>
</div>
<div>
  <button class="secundario" onclick="novaCorrida()">🔄 Nova corrida</button>
  <button class="secundario" onclick="ativarVoz()">🔊 Ativar voz</button>
</div>

<script>
const DURACAO = 5 * 60 * 1000;
const META = 100;
let lula = 0;
let bolsonaro = 0;
let inicio = Date.now();
let terminou = false;
let animacao;
let ultimaFala = 0;

function falarLula(texto) {
  falar(texto, 0.88, 0.95);
}
function falarBolsonaro(texto) {
  falar(texto, 0.75, 1.05);
}
function falar(texto, tom, velocidade) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const voz = new SpeechSynthesisUtterance(texto);
  voz.lang = "pt-BR";
  voz.pitch = tom;
  voz.rate = velocidade;
  voz.volume = 1;
  const vozes = speechSynthesis.getVoices();
  voz.voice = vozes.find(v => v.lang.toLowerCase().startsWith("pt-br")) ||
              vozes.find(v => v.lang.toLowerCase().startsWith("pt")) || null;
  speechSynthesis.speak(voz);
}
function ativarVoz() {
  falar("A corrida presidencial vai começar!", 0.9, 1);
}
function atualizar() {
  if (terminou) return;

  const decorrido = Date.now() - inicio;
  if (decorrido >= DURACAO) {
    lula = Math.max(lula, 0);
    bolsonaro = Math.max(bolsonaro, 0);
    terminou = true;
    finalizar(lula >= bolsonaro ? "Lula" : "Bolsonaro");
    return;
  }

  // Corrida automática: ambos avançam gradualmente.
  lula += 0.025 + Math.random() * 0.025;
  bolsonaro += 0.025 + Math.random() * 0.025;

  desenhar();
  if (lula >= META) finalizar("Lula");
  else if (bolsonaro >= META) finalizar("Bolsonaro");
  else animacao = requestAnimationFrame(atualizar);
}
function desenhar() {
  document.getElementById("corredorLula").style.left =
    Math.min(88, lula * 0.88) + "%";
  document.getElementById("corredorBolsonaro").style.left =
    Math.min(88, bolsonaro * 0.88) + "%";
}
function impulsoLula() {
  if (terminou) return;
  lula = Math.min(META, lula + 8);
  document.getElementById("status").textContent = "🌹 Lula recebeu um impulso!";
  falarLula("Valeu pela rosa! Bora correr!");
  desenhar();
  if (lula >= META) finalizar("Lula");
}
function impulsoBolsonaro() {
  if (terminou) return;
  bolsonaro = Math.min(META, bolsonaro + 8);
  document.getElementById("status").textContent = "🎁 Bolsonaro recebeu um impulso!";
  falarBolsonaro("Obrigado pelo presente! Vamos acelerar!");
  desenhar();
  if (bolsonaro >= META) finalizar("Bolsonaro");
}
function finalizar(vencedor) {
  if (terminou && document.getElementById("fim").textContent) return;
  terminou = true;
  cancelAnimationFrame(animacao);
  document.getElementById("fim").textContent =
    "🏆 VENCEDOR: " + vencedor.toUpperCase() + " 🎉";
  document.getElementById("status").textContent = "Fim da corrida!";
  if (vencedor === "Lula") falarLula("Vencemos a corrida! Obrigado pelo apoio!");
  else falarBolsonaro("Vencemos a corrida! Obrigado pelo apoio!");
}
function novaCorrida() {
  cancelAnimationFrame(animacao);
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  lula = 0;
  bolsonaro = 0;
  inicio = Date.now();
  terminou = false;
  document.getElementById("fim").textContent = "";
  document.getElementById("status").textContent = "A corrida começou!";
  desenhar();
  animacao = requestAnimationFrame(atualizar);
}
document.addEventListener("keydown", e => {
  if (e.key === "1" || e.key === "3") impulsoLula();
  if (e.key === "2") impulsoBolsonaro();
});
window.addEventListener("message", e => {
  const d = e.data;
  if (!d || terminou) return;
  if (d.type === "chat") {
    if (String(d.message).trim() === "13") impulsoLula();
    if (String(d.message).trim() === "22") impulsoBolsonaro();
  }
  if (d.type === "gift") {
    if (d.target === "lula") impulsoLula();
    if (d.target === "bolsonaro") impulsoBolsonaro();
  }
});
novaCorrida();
</script>
</body>
</html>
