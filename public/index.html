<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Corrida Presidencial - TikTok Live</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a14;font-family:'Arial Black',Gadget,sans-serif}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.querySelector("#game");
const c = canvas.getContext("2d");

const W = 720, H = 1280;
const ROUND_DURATION = 90000; // 90 segundos

let startTime = performance.now();
let isFinished = false;
let winnerText = "";
let speedLula = 44, speedBolso = 68;
let progressLula = 10, progressBolso = 15;
let boostEffects = [];
let chatFeedLog = [];
let autoRestartTimeout = null;

function handleResize() {
    const scaleFactor = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = window.innerWidth * scaleFactor;
    canvas.height = window.innerHeight * scaleFactor;
    c.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener("resize", handleResize);
handleResize();

function drawRect(x, y, w, h, fillColor, strokeColor = null, strokeWidth = 2) {
    c.fillStyle = fillColor;
    c.fillRect(x, y, w, h);
    if (strokeColor) {
        c.strokeStyle = strokeColor;
        c.lineWidth = strokeWidth;
        c.strokeRect(x, y, w, h);
    }
}

function drawText(textStr, x, y, size, color = "#fff", align = "center", strokeColor = "#000", strokeWidth = 4) {
    c.font = `900 ${size}px 'Arial Black', Impact, sans-serif`;
    c.textAlign = align;
    if (strokeColor) {
        c.strokeStyle = strokeColor;
        c.lineWidth = strokeWidth;
        c.strokeText(textStr, x, y);
    }
    c.fillStyle = color;
    c.fillText(textStr, x, y);
}

function drawLine(x1, y1, x2, y2, color, width) {
    c.strokeStyle = color;
    c.lineWidth = width;
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(x1, y1);
    c.lineTo(x2, y2);
    c.stroke();
}

// Estádio e arquibancadas de alta qualidade visual
function renderStadium(timestamp) {
    let skyGradient = c.createLinearGradient(0, 0, 0, 320);
    skyGradient.addColorStop(0, "#101d35");
    skyGradient.addColorStop(0.5, "#233d64");
    skyGradient.addColorStop(1, "#52759e");
    drawRect(0, 0, W, 320, skyGradient);

    drawRect(0, 150, W, 170, "#182333");
    const seatColors = ["#e53935", "#43a047", "#1e88e5", "#fdd835", "#ffffff", "#fb8c00"];
    for (let row = 0; row < 6; row++) {
        for (let col = 0; col < 40; col++) {
            let seatX = col * 19 + ((row % 2) * 9) - ((timestamp * 0.015) % 19);
            let seatY = 160 + row * 26;
            let colorIndex = (col * 5 + row * 9) % seatColors.length;
            drawRect(seatX, seatY, 10, 12, seatColors[colorIndex]);
            drawRect(seatX + 2, seatY - 5, 6, 5, "#f5c29b");
        }
    }

    drawRect(0, 310, W, 15, "#0b1018");
    drawRect(0, 325, W, 10, "#ffffff");
}

// Pista longa estendida com perspectiva
function renderExtendedTrack(timestamp) {
    drawRect(0, 335, W, 740, "#b84c38");

    for (let i = 0; i < 6; i++) {
        let lineY = 350 + i * 120;
        drawRect(0, lineY, W, 5, "rgba(255, 255, 255, 0.8)");
    }

    let trackShift = (timestamp * 0.4) % 180;
    for (let i = -2; i < 7; i++) {
        let posX = i * 180 - trackShift;
        drawLine(posX, 335, posX + 140, 1075, "rgba(255, 255, 255, 0.15)", 8);
    }
}

// Corredores detalhados
function renderRunnerCaricature(x, y, teamType, timestamp, isLeader) {
    c.save();
    c.translate(x, y);
    c.scale(1.3, 1.3);

    const isLula = teamType === "lula";
    const shirtColor = isLula ? "#d62828" : "#1b8a4f";
    const pantsColor = isLula ? "#9e1b1b" : "#125933";
    const runCycle = Math.sin(timestamp * 0.03);

    c.fillStyle = "rgba(0, 0, 0, 0.4)";
    c.beginPath();
    c.ellipse(0, 15, 38, 10, 0, 0, Math.PI * 2);
    c.fill();

    drawLine(-10, -5, -25 + runCycle * 22, 18, pantsColor, 14);
    drawLine(10, -5, 25 - runCycle * 22, 18, pantsColor, 14);

    drawRect(-32 + runCycle * 22, 15, 16, 9, "#ffffff");
    drawRect(16 - runCycle * 22, 15, 16, 9, "#ffffff");

    drawRect(-20, -58, 40, 50, shirtColor, isLula ? "#ff6b6b" : "#4ae38d", 2);
    if (!isLula) {
        drawRect(-20, -58, 40, 9, "#f3c623");
    } else {
        drawText("★", 0, -31, 18, "#ffffff", "center", null);
    }

    drawLine(-20, -48, -32 - runCycle * 16, -26, shirtColor, 12);
    drawLine(20, -48, 32 + runCycle * 16, -26, shirtColor, 12);

    c.fillStyle = "#f3be98";
    c.beginPath();
    c.arc(0, -85, 30, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = "#1a1a1a";
    c.lineWidth = 2;
    c.stroke();

    if (isLula) {
        c.fillStyle = "#e0e0e0";
        c.beginPath(); c.arc(0, -98, 31, Math.PI, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(0, -78, 30, 0.2, Math.PI - 0.2); c.fill();
        drawRect(-30, -104, 60, 9, "#d62828");
    } else {
        c.fillStyle = "#3d2b1f";
        c.beginPath(); c.arc(0, -100, 30, Math.PI * 0.8, Math.PI * 2.2); c.fill();
        drawRect(-20, -89, 15, 10, "rgba(0,0,0,0.15)", "#333", 2);
        drawRect(5, -89, 15, 10, "rgba(0,0,0,0.15)", "#333", 2);
        drawLine(-5, -84, 5, -84, "#333", 2);
    }

    drawRect(2, -87, 6, 6, "#111", null);
    drawRect(18, -87, 6, 6, "#111", null);
    drawLine(4, -72, 20, -72, "#924040", 3);

    c.restore();

    let tagBackground = isLeader ? "#f3c623" : "#d62828";
    let tagMessage = isLeader ? (isLula ? "1º  13 LULA" : "1º  22 BOLSO") : (isLula ? "2º  13 LULA" : "2º  22 BOLSO");
    drawRect(x - 72, y - 195, 144, 30, tagBackground, "#ffffff", 2);
    drawText(tagMessage, x, y - 174, 15, "#000000", "center", "#ffffff", 1);
}

// Menu lateral com rosas e ícones de música
function renderGiftsSidebar() {
    renderSingleGiftBadge(40, 360, "🌹", "13 VELOZ", "#e62238");
    renderSingleGiftBadge(40, 460, "❤️", "22 ESCORREGA", "#e62238");
    renderSingleGiftBadge(40, 560, "🍩", "13 SUPER VELOZ", "#e62238");

    renderSingleGiftBadge(W - 40, 360, "🎵", "22 VELOZ", "#11a855");
    renderSingleGiftBadge(W - 40, 460, "🦖", "13 ESCORREGA", "#11a855");
    renderSingleGiftBadge(W - 40, 560, "🎉", "22 SUPER VELOZ", "#11a855");
}

function renderSingleGiftBadge(x, y, emojiSymbol, labelText, themeColor) {
    c.save();
    c.fillStyle = "rgba(0, 0, 0, 0.7)";
    c.beginPath();
    c.arc(x, y, 26, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = themeColor;
    c.lineWidth = 3;
    c.stroke();
    drawText(emojiSymbol, x, y + 9, 24, "#fff", "center", null);

    if (x < W / 2) {
        drawText(labelText, x + 36, y + 5, 12, themeColor, "left", "#000", 3);
    } else {
        drawText(labelText, x - 36, y + 5, 12, themeColor, "right", "#000", 3);
    }
    c.restore();
}

// Placar superior idêntico ao layout do vídeo com o feed flutuante de chat abaixo
function renderTopArcadeHUD(elapsedTimeMs) {
    drawRect(0, 0, W, 195, "#090e17");
    drawText("CORRIDA PRESIDENCIAL", W / 2 - 40, 38, 24, "#ffffff", "center", "#000", 5);

    drawRect(W - 145, 12, 130, 42, "#f3c623", "#000", 3);
    let secondsLeft = Math.max(0, Math.ceil((ROUND_DURATION - elapsedTimeMs) / 1000));
    drawText(`00:${String(secondsLeft).padStart(2, '0')}s`, W - 80, 41, 26, "#000000", "center", null);

    const isLulaAhead = progressLula >= progressBolso;

    renderCompetitorCard(15, 55, isLulaAhead ? "1º" : "2º", "13 LULA", progressLula, Math.floor(speedLula), "#d62828", isLulaAhead);
    renderCompetitorCard(15, 97, isLulaAhead ? "2º" : "1º", "22 BOLSO", progressBolso, Math.floor(speedBolso), "#11a855", !isLulaAhead);

    // Feed do chat simulado idêntico à interface da live (linhas rolando)
    drawRect(15, 142, W - 30, 44, "rgba(16, 26, 45, 0.95)", "#223555", 2);
    if (chatFeedLog.length > 0) {
        let currentChat = chatFeedLog[chatFeedLog.length - 1];
        drawText(`${currentChat.user} enviou ${currentChat.gift} x${currentChat.count}`, 25, 169, 13, "#ffffff", "left", "#000", 2);
        drawText(`IMPULSO - ${currentChat.target.toUpperCase()}`, 380, 169, 12, "#f3c623", "left", "#000", 2);
    }
}

function renderCompetitorCard(x, y, positionText, nameText, percentageVal, speedVal, cardColor, isLeaderCard) {
    drawRect(x, y, W - 30, 38, "#162032", "#000", 2);
    drawRect(x + 4, y + 4, 30, 30, isLeaderCard ? "#f3c623" : "#3a4d6e");
    drawText(positionText, x + 19, y + 25, 14, isLeaderCard ? "#000" : "#fff", "center", null);
    drawText(nameText, x + 100, y + 26, 15, cardColor, "left", "#000", 3);
    drawRect(x + 180, y + 11, 320, 16, "#0a0f18");
    drawRect(x + 180, y + 11, 320 * (percentageVal / 100), 16, cardColor);
    drawText(`${Math.floor(percentageVal)}%`, x + 535, y + 26, 15, "#ffffff", "right", "#000", 2);
    drawText(`${speedVal} KM/H`, x + 635, y + 26, 13, "#f3c623", "right", "#000", 2);
}

// Régua inferior de distância
function renderDistanceMeterWidget() {
    let metersGap = Math.abs(progressLula - progressBolso) * 4.2;
    drawRect(45, 1140, W - 90, 34, "rgba(0, 0, 0, 0.7)", "#334466", 2);
    drawLine(70, 1157, W - 70, 1157, "#f3c623", 3);
    drawLine(70, 1148, 70, 1166, "#f3c623", 3);
    drawLine(W - 70, 1148, W - 70, 1166, "#f3c623", 3);
    drawText(`+${metersGap.toFixed(1)} m`, W / 2, 1163, 18, "#4ae38d", "center", "#000", 3);
}

function renderFloatingBoostEffects(currentTime) {
    for (let i = boostEffects.length - 1; i >= 0; i--) {
        let fx = boostEffects[i];
        let lifespan = currentTime - fx.startTime;
        if (lifespan > 1800) {
            boostEffects.splice(i, 1);
            continue;
        }
        let alphaValue = 1 - (lifespan / 1800);
        let currentY = fx.posY - (lifespan * 0.06);

        c.save();
        c.globalAlpha = alphaValue;
        drawText(fx.message, fx.posX, currentY, 28, fx.color, "center", "#000000", 5);
        c.restore();
    }
}

// Lógica de +5% de impulso por interação automática no chat
function simulateLiveInteractions(timestamp) {
    if (isFinished) return;
    
    if (!window.lastInteractionTime || timestamp - window.lastInteractionTime > 2800) {
        window.lastInteractionTime = timestamp;
        if (Math.random() > 0.5) {
            progressLula = Math.min(100, progressLula + 5); // Exatos 5% de impulso
            speedLula += 5;
            boostEffects.push({ posX: 220, posY: 580, message: "+5% IMPULSO", color: "#4ae38d", startTime: timestamp });
            chatFeedLog.push({ user: "OBenny", gift: "Rosa 🌹", count: 1, target: "13 Lula" });
        } else {
            progressBolso = Math.min(100, progressBolso + 5); // Exatos 5% de impulso
            speedBolso += 5;
            boostEffects.push({ posX: 500, posY: 720, message: "+5% IMPULSO", color: "#4ae38d", startTime: timestamp });
            chatFeedLog.push({ user: "Ricelly", gift: "TikTok 🎵", count: 1, target: "22 Bolsonaro" });
        }
    }
}

function resetRoundAutomatically() {
    startTime = performance.now();
    isFinished = false;
    winnerText = "";
    progressLula = 10;
    progressBolso = 15;
    speedLula = 44;
    speedBolso = 68;
    boostEffects = [];
    chatFeedLog = [];
    if (autoRestartTimeout) {
        clearTimeout(autoRestartTimeout);
        autoRestartTimeout = null;
    }
}

function gameLoop(timestamp) {
    let elapsedTime = timestamp - startTime;

    if (!isFinished) {
        progressLula = Math.min(100, progressLula + (speedLula * 0.0004));
        progressBolso = Math.min(100, progressBolso + (speedBolso * 0.0004));

        if (speedLula > 44) speedLula -= 0.05;
        if (speedBolso > 68) speedBolso -= 0.05;

        simulateLiveInteractions(timestamp);

        if (progressLula >= 100 || progressBolso >= 100 || elapsedTime >= ROUND_DURATION) {
            isFinished = true;
            winnerText = progressLula > progressBolso ? "13 LULA VENCEU!" : (progressBolso > progressLula ? "22 BOLSONARO VENCEU!" : "EMPATE!");
            
            if (!autoRestartTimeout) {
                autoRestartTimeout = setTimeout(() => {
                    resetRoundAutomatically();
                }, 6000);
            }
        }
    }

    renderStadium(timestamp);
    renderExtendedTrack(timestamp);

    let runnerXLula = 90 + (progressLula * 5.4);
    let runnerXBolso = 90 + (progressBolso * 5.4);
    let lulaLeads = progressLula >= progressBolso;

    // Pistas ajustadas na proporção exata da referência
    renderRunnerCaricature(Math.min(W - 95, runnerXLula), 620, "lula", timestamp, lulaLeads);
    renderRunnerCaricature(Math.min(W - 95, runnerXBolso), 880, "bolsonaro", timestamp + 400, !lulaLeads);

    renderGiftsSidebar();
    renderFloatingBoostEffects(timestamp);
    renderDistanceMeterWidget();
    renderTopArcadeHUD(elapsedTime);

    if (isFinished) {
        drawRect(80, 500, W - 160, 200, "rgba(9, 14, 23, 0.96)", "#f3c623", 4);
        drawText("FIM DA RODADA!", W / 2, 560, 32, "#ffffff", "center", "#000", 5);
        drawText(winnerText, W / 2, 630, 28, winnerText.includes("13") ? "#e62238" : "#11a855", "center", "#000", 4);
        drawText("Reiniciando nova rodada...", W / 2, 675, 15, "#ccc", "center", null);
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
