<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Corrida Presidencial - Live TikTok</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a14;font-family:'Arial Black',Gadget,sans-serif}
canvas{display:block;width:100%;height:100%}

#controls{
 position:fixed;bottom:0;left:0;right:0;
 padding:12px 10px calc(12px + env(safe-area-inset-bottom));
 display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
 background:rgba(5,10,20,0.96);border-top:2px solid #1a2942;z-index:100;
}
button{
 border:0;border-radius:8px;padding:10px 14px;color:white;font-weight:bold;
 background:#283854;font-size:12px;cursor:pointer;box-shadow:0 3px 0 #152033;
 transition:transform 0.1s ease;
}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #152033}
.red{background:#e62238;box-shadow:0 3px 0 #9e1122}
.green{background:#11a855;box-shadow:0 3px 0 #0a6934}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="controls">
<button class="red" onclick="giftLula('Rosa', 30)">🌹 ROSA (+30% LULA)</button>
<button class="green" onclick="giftBolsonaro('TikTok', 30)">🎵 TIKTOK (+30% BOLSO)</button>
<button class="red" onclick="giftLula('Rosa Dupla', 60)">🌹 ROSA DUPLA (+60%)</button>
<button class="green" onclick="giftBolsonaro('TikTok Gigante', 60)">🎵 TIKTOK GIGANTE (+60%)</button>
<button onclick="restart()">↻ REINICIAR</button>
</div>

<script>
const canvas=document.querySelector("#game");
const c=canvas.getContext("2d");

// Resolução interna fixa de alta definição (Proporção Vertical 9:16 para Live)
const W=720,H=1280;
const DURATION=60000; // 60 segundos por rodada

let start=performance.now(),finished=false,winner="";
let speedL=44, speedB=88; // KM/H
let distL=10, distB=13;   // % de progresso
let boostTextEffects=[];
let recentGifts=[];

function resize(){
 const d=Math.min(window.devicePixelRatio||1, 3);
 canvas.width=window.innerWidth*d;
 canvas.height=window.innerHeight*d;
 c.setTransform(canvas.width/W, 0, 0, canvas.height/H, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function rect(x,y,w,h,color,border=null,borderW=2){
 c.fillStyle=color;
 c.fillRect(x,y,w,h);
 if(border){
  c.strokeStyle=border;
  c.lineWidth=borderW;
  c.strokeRect(x,y,w,h);
 }
}

function text(s,x,y,size,color="#fff",align="center",strokeColor="#000",strokeW=4){
 c.font=`900 ${size}px 'Arial Black', Impact, sans-serif`;
 c.textAlign=align;
 if(strokeColor){
  c.strokeStyle=strokeColor;
  c.lineWidth=strokeW;
  c.strokeText(s,x,y);
 }
 c.fillStyle=color;
 c.fillText(s,x,y);
}

function line(x1,y1,x2,y2,color,width){
 c.strokeStyle=color;
 c.lineWidth=width;
 c.lineCap="round";
 c.beginPath();
 c.moveTo(x1,y1);
 c.lineTo(x2,y2);
 c.stroke();
}

// Estádio e Arquibancada com torcida animada
function drawBackground(t){
 let sky=c.createLinearGradient(0,0,0,500);
 sky.addColorStop(0,"#182d53");
 sky.addColorStop(1,"#4b72a3");
 rect(0,0,W,500,sky);

 rect(0,180,W,220,"#1f2838");
 const crowdColors=["#e53935","#43a047","#1e88e5","#fdd835","#ffffff","#fb8c00"];
 for(let r=0;r<6;r++){
  for(let col=0;col<40;col++){
   let x=col*19 + ((r%2)*9) - ((t*.02)%19);
   let y=200 + r*28;
   let color=crowdColors[(col*3 + r*7)%crowdColors.length];
   rect(x,y,10,12,color);
   rect(x+2,y-5,6,6,"#f5c29b");
  }
 }
 rect(0,370,W,25,"#0b1018");
 rect(0,395,W,10,"#ffffff");
}

// Pista de corrida profissional
function drawTrack(t){
 rect(0,405,W,550,"#b84c38");
 for(let i=0;i<6;i++){
  let y=420+i*90;
  rect(0,y,W,4,"rgba(255,255,255,0.7)");
 }
 let shift=(t*.25)%180;
 for(let i=-2;i<6;i++){
  let x=i*180 - shift;
  line(x,405,x+100,955,"rgba(255,255,255,0.15)",6);
 }
}

// Desenho otimizado e detalhado dos corredores
function drawRunner(x,y,team,t,isFirst){
 c.save();
 c.translate(x,y);
 c.scale(1.25,1.25);

 const isLula=team==="lula";
 const shirtColor=isLula?"#d62828":"#1b8a4f";
 const pantsColor=isLula?"#9e1b1b":"#125933";
 const runCycle=Math.sin(t*0.025);

 // Sombra no solo
 c.fillStyle="rgba(0,0,0,0.4)";
 c.beginPath();
 c.ellipse(0,10,36,9,0,0,Math.PI*2);
 c.fill();

 // Pernas
 line(-8,-10,-18+runCycle*18,10,pantsColor,12);
 line(8,-10,18-runCycle*18,10,pantsColor,12);

 // Tênis esportivos
 rect(-24+runCycle*18,8,14,7,"#ffffff");
 rect(12-runCycle*18,8,14,7,"#ffffff");

 // Tronco
 rect(-18,-55,36,45,shirtColor,isLula?"#ff6b6b":"#4ae38d",2);
 if(!isLula){
  rect(-18,-55,36,8,"#f3c623");
 }else{
  text("★",0,-30,16,"#ffffff","center",null);
 }

 // Braços
 line(-18,-45,-28-runCycle*12,-25,shirtColor,10);
 line(18,-45,28+runCycle*12,-25,shirtColor,10);

 // Cabeça Caricatura
 c.fillStyle="#f3be98";
 c.beginPath();
 c.arc(0,-80,28,0,Math.PI*2);
 c.fill();
 c.strokeStyle="#222";
 c.lineWidth=2;
 c.stroke();

 if(isLula){
  c.fillStyle="#e0e0e0";
  c.beginPath();c.arc(0,-92,29,Math.PI,Math.PI*2);c.fill();
  c.beginPath();c.arc(0,-75,28,0.2,Math.PI-0.2);c.fill();
  rect(-28,-98,56,8,"#d62828");
 }else{
  c.fillStyle="#3d2b1f";
  c.beginPath();c.arc(0,-95,28,Math.PI*0.8,Math.PI*2.2);c.fill();
  rect(-18,-84,14,10,"rgba(0,0,0,0.1)","#333",2);
  rect(4,-84,14,10,"rgba(0,0,0,0.1)","#333",2);
  line(-4,-79,4,-79,"#333",2);
 }

 rect(-12,-82,5,5,"#111",null);
 rect(7,-82,5,5,"#111",null);
 line(-8,-68,8,-68,"#924040",3);

 c.restore();

 // Etiqueta superior do corredor
 let tagBg=isFirst?"#f3c623":"#d62828";
 let tagText=isFirst?(isLula?"1º  13 LULA":"1º  22 BOLSO"):(isLula?"2º  13 LULA":"2º  22 BOLSO");
 rect(x-68,y-175,136,26,tagBg,"#ffffff",2);
 text(tagText,x,y-156,13,"#000000","center","#ffffff",1);
}

// Menu lateral com Rosa para o Lula e TikTok para o Bolsonaro
function drawGiftsMenu(){
 drawGiftIcon(35, 340, "🌹", "ROSA", "#e62238");
 drawGiftIcon(35, 430, "🌹", "ROSA VELOZ", "#e62238");
 drawGiftIcon(35, 520, "🌹", "ROSA SUP", "#e62238");

 drawGiftIcon(W-35, 340, "🎵", "TIKTOK", "#11a855");
 drawGiftIcon(W-35, 430, "🎵", "TIKTOK VELOZ", "#11a855");
 drawGiftIcon(W-35, 520, "🎵", "TIKTOK SUP", "#11a855");
}

function drawGiftIcon(x,y,emoji,label,color){
 c.save();
 c.fillStyle="rgba(0,0,0,0.6)";
 c.beginPath();c.arc(x,y,25,0,Math.PI*2);c.fill();
 c.strokeStyle=color;c.lineWidth=3;c.stroke();
 text(emoji,x,y+8,24,"#fff","center",null);

 if(x<W/2){
  text(label,x+35,y+5,12,color,"left","#000",3);
 }else{
  text(label,x-35,y+5,12,color,"right","#000",3);
 }
 c.restore();
}

// Placar Superior estilo Arcade
function drawTopHUD(elapsed){
 rect(0,0,W,140,"#090e17");

 text("CORRIDA PRESIDENCIAL",220,42,24,"#ffffff","#000",5);

 rect(W-140,12,125,44,"#f3c623","#000",3);
 let remainSec=Math.max(0,Math.ceil((DURATION-elapsed)/1000));
 text(`00:${String(remainSec).padStart(2,'0')}s`,W-77,43,26,"#000000","center",null);

 const lulaFirst=distL>=distB;

 drawPlayerCard(15, 55, lulaFirst?"1º":"2º", "13 LULA", distL, speedL, "#d62828", lulaFirst);
 drawPlayerCard(15, 98, lulaFirst?"2º":"1º", "22 BOLSO", distB, speedB, "#11a855", !lulaFirst);

 if(recentGifts.length>0){
  let g=recentGifts[recentGifts.length-1];
  rect(15,148,420,38,"rgba(10,18,32,0.95)","#283b5e",2);
  text(`${g.user} enviou ${g.gift} x${g.count}`,25,172,13,"#ffffff","left","#000",2);
  text(`IMPULSO - ${g.target.toUpperCase()}`,300,172,12,"#f3c623","left","#000",2);
 }
}

function drawPlayerCard(x,y,pos,name,pct,speed,color,isLead){
 rect(x,y,W-30,36,"#162032","#000",2);

 rect(x+4,y+4,28,28,isLead?"#f3c623":"#3a4d6e");
 text(pos,x+18,y+24,14,isLead?"#000":"#fff","center",null);

 text(name,x+95,y+24,15,color,"left","#000",3);

 rect(x+170,y+10,340,16,"#0a0f18");
 rect(x+170,y+10,340*(pct/100),16,color);

 text(`${Math.floor(pct)}%`,x+530,y+24,15,"#ffffff","right","#000",2);
 text(`${speed} KM/H`,x+620,y+24,13,"#f3c623","right","#000",2);
}

// Medidor de distância inferior
function drawDistanceMeter(){
 let diff=Math.abs(distL-distB)*2.5;
 rect(40,1050,W-80,30,"rgba(0,0,0,0.6)","#334466",2);
 line(60,1065,W-60,1065,"#f3c623",3);
 line(60,1058,60,1072,"#f3c623",3);
 line(W-60,1058,W-60,1072,"#f3c623",3);

 text(`+${diff.toFixed(1)} m`,W/2,1071,16,"#4ae38d","center","#000",3);
}

function drawBoostEffects(now){
 for(let i=boostTextEffects.length-1;i>=0;i--){
  let ef=boostTextEffects[i];
  let age=now-ef.start;
  if(age>1800){
   boostTextEffects.splice(i,1);
   continue;
  }
  let alpha=1 - (age/1800);
  let y=ef.y - (age*0.05);

  c.save();
  c.globalAlpha=alpha;
  text(ef.msg, ef.x, y, 28, ef.color, "center", "#000000", 6);
  c.restore();
 }
}

function giftLula(giftName="Rosa", boostVal=30){
 if(finished)return;
 distL=Math.min(100, distL+boostVal*0.25);
 speedL+=12;
 boostTextEffects.push({
  x:200, y:550, msg:`+${boostVal}% IMPULSO`, color:"#4ae38d", start:performance.now()
 });
 recentGifts.push({user:"Apoiador 13", gift:giftName, count:1, target:"13 Lula"});
}

function giftBolsonaro(giftName="TikTok", boostVal=30){
 if(finished)return;
 distB=Math.min(100, distB+boostVal*0.25);
 speedB+=12;
 boostTextEffects.push({
  x:520, y:650, msg:`+${boostVal}% IMPULSO`, color:"#4ae38d", start:performance.now()
 });
 recentGifts.push({user:"Apoiador 22", gift:giftName, count:1, target:"22 Bolsonaro"});
}

function restart(){
 start=performance.now();finished=false;winner="";
 distL=10;distB=13;
 speedL=44;speedB=88;
 boostTextEffects=[];recentGifts=[];
}

function loop(now){
 let elapsed=now-start;

 if(!finished){
  distL=Math.min(100, distL + (speedL*0.0008));
  distB=Math.min(100, distB + (speedB*0.0008));

  if(speedL>44)speedL-=0.05;
  if(speedB>44)speedB-=0.05;

  if(distL>=100 || distB>=100 || elapsed>=DURATION){
   finished=true;
   winner=distL>distB?"13 LULA":(distB>distL?"22 BOLSONARO":"EMPATE");
  }
 }

 drawBackground(now);
 drawTrack(now);

 let xLula = 100 + (distL*5.0);
 let xBolso = 100 + (distB*5.0);
 const lulaFirst = distL>=distB;

 drawRunner(Math.min(W-90,xLula), 650, "lula", now, lulaFirst);
 drawRunner(Math.min(W-90,xBolso), 850, "bolsonaro", now+500, !lulaFirst);

 drawGiftsMenu();
 drawBoostEffects(now);
 drawDistanceMeter();
 drawTopHUD(elapsed);

 if(finished){
  rect(100,500,W-200,180,"rgba(9,14,23,0.95)","#f3c623",4);
  text("FIM DA CORRIDA!",W/2,550,28,"#ffffff","center","#000",4);
  text(`VENCEDOR: ${winner}`,W/2,610,24,winner.includes("13")?"#e62238":"#11a855","center","#000",4);
  text("Clique em REINICIAR para nova rodada",W/2,650,14,"#ccc","center",null);
 }

 requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
